        bind   = ,SunProps    , exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || fuzzel # [hidden] Launcher (fallback)

        bind   = $HYPR             , Left   , workspace, e-1 #⬩Scroll left through existing workspaces⬩
