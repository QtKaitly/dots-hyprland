        source=~/.config/hypr/custom/defaults.conf


        $HYPR  = Mod3
        $OPT   = SUPER
        $Menu = XF86Launch7

        $WHUP    = mouse_up
        $WHDN    = mouse_down
        $WHL     = mouse_left
        $WHR     = mouse_right
        $MCLK    = mouse:272
        $MCLKR   = mouse:273

        $F13     = code:191
        $F14     = code:192
        $F15     = code:193
        $F16     = code:194
        $F17     = code:195
        $F18     = code:196
        $F19     = code:197
        $F20     = code:198
        $F21     = code:199
        $F22     = code:200
        $F23     = code:201
        $F24     = code:202



#!
##! Shell
## ━━━━━━━━━━ ━━ ━━━━ ━━━ ━ -- -                       ANCHOR Shell                        
## -----~~~+++++++====================================================================================+++++++~~~----- ##

# These absolutely need to be on top, or they won't work consistently
bindidr = $HYPR, , Toggle overview, global, quickshell:overviewToggleRelease # Toggle overview/launcher
#bind = $OPT, Super_L, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || fuzzel # [hidden] Launcher (fallback)
binditn = $OPT, catchall, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = Ctrl, Super_L, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $OPT, mouse:272, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $OPT, mouse:273, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $OPT, mouse:274, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $OPT, mouse:275, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $OPT, mouse:276, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $OPT, mouse:277, global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $OPT, mouse_up,  global, quickshell:overviewToggleReleaseInterrupt # [hidden]
bind = $OPT, mouse_down,global, quickshell:overviewToggleReleaseInterrupt # [hidden]

bindit = ,Super_L, global, quickshell:workspaceNumber # [hidden]
bindd = $HYPR, V, Clipboard history >> clipboard, global, quickshell:overviewClipboardToggle # Clipboard history >> clipboard
bindd = $OPT, Period, Emoji >> clipboard, global, quickshell:overviewEmojiToggle # Emoji >> clipboard
bindd = $OPT, Tab, Toggle overview, global, quickshell:overviewToggle # [hidden] Toggle overview/launcher (alt)
bindd = $OPT, A, Toggle left sidebar, global, quickshell:sidebarLeftToggle # Toggle left sidebar
bind = $OPT+Alt, A, global, quickshell:sidebarLeftToggleDetach # [hidden]
bind = $OPT, B, global, quickshell:sidebarLeftToggle # [hidden]
bind = $OPT, O, global, quickshell:sidebarLeftToggle # [hidden]
bindd = $OPT, N, Toggle right sidebar, global, quickshell:sidebarRightToggle # Toggle right sidebar
bindd = $OPT, Slash, Toggle cheatsheet, global, quickshell:cheatsheetToggle # Toggle cheatsheet
bindd = $OPT, K, Toggle on-screen keyboard, global, quickshell:oskToggle # Toggle on-screen keyboard
bindd = $OPT, M, Toggle media controls, global, quickshell:mediaControlsToggle # Toggle media controls
bindd = Ctrl+Alt, Delete, Toggle session menu, global, quickshell:sessionToggle # Toggle session menu
bindd = $OPT, J, Toggle bar, global, quickshell:barToggle # Toggle bar
bind = Ctrl+Alt, Delete, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill wlogout || wlogout -p layer-shell # [hidden] Session menu (fallback)
bind = Shift+$OPT+Alt, Slash, exec, qs -p ~/.config/quickshell/$qsConfig/welcome.qml # [hidden] Launch welcome app

bindle=, XF86MonBrightnessUp, exec, qs -c $qsConfig ipc call brightness increment || brightnessctl s 5%+ # [hidden]
bindle=, XF86MonBrightnessDown, exec, qs -c $qsConfig ipc call brightness decrement || brightnessctl s 5%- # [hidden]
bindle=, XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 2%+ # [hidden]
bindle=, XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 2%- # [hidden]

bindl = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SINK@ toggle # [hidden]
bindld = $OPT+Shift,M, Toggle mute, exec, wpctl set-mute @DEFAULT_SINK@ toggle # [hidden]
bindl = Alt ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindl = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindld = $OPT+Alt,M, Toggle mic, exec, wpctl set-mute @DEFAULT_SOURCE@ toggle # [hidden]
bindd = Ctrl+$OPT, T, Change wallpaper, exec, ~/.config/quickshell/$qsConfig/scripts/colors/switchwall.sh # Change wallpaper
bind = Ctrl+$OPT, R, exec, killall ags agsv1 gjs ydotool qs quickshell; qs -c $qsConfig & # Restart widgets

##! Utilities
## ━━━━━━━━━━ ━━ ━━━━ ━━━ ━ -- -                     ANCHOR Utilities                      
## -----~~~+++++++====================================================================================+++++++~~~----- ##

# Screenshot, Record, OCR, Color picker, Clipboard history
bindd = $OPT, V, Copy clipboard history entry, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || cliphist list | fuzzel --match-mode fzf --dmenu | cliphist decode | wl-copy # [hidden] Clipboard history >> clipboard (fallback)
bindd = $OPT, Period, Copy an emoji, exec, qs -c $qsConfig ipc call TEST_ALIVE || pkill fuzzel || ~/.config/hypr/hyprland/scripts/fuzzel-emoji.sh copy # [hidden] Emoji >> clipboard (fallback)
bindd = $OPT+Shift, S, Screen snip, exec, qs -p ~/.config/quickshell/$qsConfig/screenshot.qml || pidof slurp || hyprshot --freeze --clipboard-only --mode region --silent # Screen snip
# OCR
bindd = $OPT+Shift, T, Character recognition,exec,grim -g "$(slurp $SLURP_ARGS)" "tmp.png" && tesseract "tmp.png" - | wl-copy && rm "tmp.png" # [hidden]
# Color picker
bindd = $OPT+Shift, C, Color picker, exec, hyprpicker -a # Pick color (Hex) >> clipboard
# Fullscreen screenshot
bindld = ,Print, Screenshot >> clipboard ,exec,grim - | wl-copy # Screenshot >> clipboard
bindld = Ctrl,Print, Screenshot >> clipboard & save, exec, mkdir -p $(xdg-user-dir PICTURES)/Screenshots && grim $(xdg-user-dir PICTURES)/Screenshots/Screenshot_"$(date '+%Y-%m-%d_%H.%M.%S')".png # Screenshot >> clipboard & file
# Recording stuff
bindd = $OPT+Alt, R, Record region (no sound), exec, ~/.config/hypr/hyprland/scripts/record.sh # Record region (no sound)
bindd = Ctrl+Alt, R, Record screen (no sound), exec, ~/.config/hypr/hyprland/scripts/record.sh --fullscreen # [hidden] Record screen (no sound)
bindd = $OPT+Shift+Alt, R, Record screen (with sound), exec, ~/.config/hypr/hyprland/scripts/record.sh --fullscreen-sound # Record screen (with sound)
# AI
bindd = $OPT+Shift+Alt, mouse:273, Generate AI summary for selected text, exec, ~/.config/hypr/hyprland/scripts/ai/primary-buffer-query.sh # AI summary for selected text

#!
##! Window
## ━━━━━━━━━━ ━━ ━━━━ ━━━ ━ -- -                       ANCHOR Window                       
## -----~~~+++++++====================================================================================+++++++~~~----- ##
# Grouping
bind = $OPT, G, togglegroup, # Make Active Window Groupable
#/# bind = $OPT, ↑/↓,, # Switch Group Tabs in direction
bindr = $OPT , up  , changegroupactive, b # [hidden]
bindr = $OPT , down, changegroupactive, f # [hidden]

# Focusing
bindm = $OPT, mouse:272, movewindow # Move
bindm = $OPT, mouse:274, movewindow # [hidden]
bindm = $OPT, mouse:273, resizewindow # Resize
#/# bind = $OPT, ←/↑/→/↓,, # Focus in direction
bind = $OPT, Left, movefocus, l # [hidden]
bind = $OPT, Right, movefocus, r # [hidden]
bind = $OPT, Up, movefocus, u # [hidden]
bind = $OPT, Down, movefocus, d # [hidden]

#/# bind = $OPT+Shift, ←/↑/→/↓,, # Move in direction
bind = $OPT+Shift, Left, movewindow, l # [hidden]
bind = $OPT+Shift, Right, movewindow, r # [hidden]
bind = $OPT+Shift, Up, movewindow, u # [hidden]
bind = $OPT+Shift, Down, movewindow, d # [hidden]

bind = $OPT, Escape, killactive, # Close
bind = $OPT+Shift+Alt, Escape, exec, hyprctl kill # Forcefully zap a window


# Window split ratio
#/# binde = $OPT, ;/',, # Adjust split ratio
binde = $OPT, Semicolon, splitratio, -0.1 # [hidden]
binde = $OPT, Apostrophe, splitratio, +0.1 # [hidden]
# Positioning mode
bind = $OPT+Alt, Space, togglefloating, # Float/Tile
bind = $OPT, D, fullscreen, 1 # Maximize
bind = $OPT, F, fullscreen, 0 # Fullscreen
bind = $OPT+Alt, F, fullscreenstate, 0 3 # Fullscreen spoof
bind = $OPT, P, pin # Pin

#/# bind = $OPT+Alt, Hash,, # Send to workspace # (1, 2, 3,...)
bind = $OPT+Alt, 1, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 1 # [hidden]
bind = $OPT+Alt, 2, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 2 # [hidden]
bind = $OPT+Alt, 3, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 3 # [hidden]
bind = $OPT+Alt, 4, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 4 # [hidden]
bind = $OPT+Alt, 5, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 5 # [hidden]
bind = $OPT+Alt, 6, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 6 # [hidden]
bind = $OPT+Alt, 7, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 7 # [hidden]
bind = $OPT+Alt, 8, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 8 # [hidden]
bind = $OPT+Alt, 9, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 9 # [hidden]
bind = $OPT+Alt, 0, exec, ~/.config/hypr/hyprland/scripts/workspace_action.sh movetoworkspacesilent 10 # [hidden]

# #/# bind = $OPT+Shift, Scroll ↑/↓,, # Send to workspace left/right
bind = $OPT+Shift, mouse_down, movetoworkspace, r-1 # [hidden]
bind = $OPT+Shift, mouse_up, movetoworkspace, r+1 # [hidden]
bind = $OPT+Alt, mouse_down, movetoworkspace, -1 # [hidden]
bind = $OPT+Alt, mouse_up, movetoworkspace, +1 # [hidden]

#/# bind = $OPT+Shift, Page_↑/↓,, # Send to workspace left/right
bind = $OPT+Alt, Page_Down, movetoworkspace, +1 # [hidden]
bind = $OPT+Alt, Page_Up, movetoworkspace, -1 # [hidden]
bind = $OPT+Shift, Page_Down, movetoworkspace, r+1  # [hidden]
bind = $OPT+Shift, Page_Up, movetoworkspace, r-1  # [hidden]
bind = Ctrl+$OPT+Shift, Right, movetoworkspace, r+1 # [hidden]
bind = Ctrl+$OPT+Shift, Left, movetoworkspace, r-1 # [hidden]

bind = $OPT+Alt, S, movetoworkspacesilent, special # Send to scratchpad

bind = Ctrl+$OPT, S, togglespecialworkspace, # [hidden]
bind = Alt, Tab, cyclenext # [hidden] sus keybind
bind = Alt, Tab, bringactivetotop, # [hidden] bring it to the top

##! Workspace
